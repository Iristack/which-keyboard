name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and architecture
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            printf 'RELEASE_VERSION=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            printf 'RELEASE_VERSION=dev-%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi
          test "$(uname -m)" = "$RELEASE_ARCH"

      - name: Build and test
        run: make test

      - name: Sign and package
        run: |
          codesign --force --sign - build/which-keyboard
          codesign --verify --strict build/which-keyboard
          python3 tools/package_release.py --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify both packages and publish
        shell: bash
        working-directory: dist
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          arm="which-keyboard-${RELEASE_VERSION}-macos-arm64.tar.gz"
          intel="which-keyboard-${RELEASE_VERSION}-macos-x86_64.tar.gz"
          test -s "$arm"
          test -s "$intel"
          cat "$arm.sha256" "$intel.sha256" > SHA256SUMS
          sha256sum --check SHA256SUMS

          cat > release-notes.md <<'NOTES'
          Prebuilt packages for Apple Silicon (`arm64`) and Intel (`x86_64`).
          Each archive includes the native helper, zsh plugin, documentation, and MIT license.

          Download the archive matching your Mac and `SHA256SUMS`. Verify the downloaded
          archive with `shasum -a 256 -c SHA256SUMS --ignore-missing`, extract it, and source
          `which-keyboard.plugin.zsh` from the extracted directory after your zsh theme.

          Build target: macOS 12 or later. Tested on macOS 15 runners.
          Binaries are ad-hoc signed, not Developer ID signed or notarized.

          中文：按芯片架构下载压缩包和校验文件，校验并解压后加载包内的 zsh 插件即可，无需本机编译。
          NOTES

          if gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true || {
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_VERSION" --verify-tag --draft \
              --title "$RELEASE_VERSION" --generate-notes --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_VERSION" "$arm" "$intel" SHA256SUMS --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --latest
